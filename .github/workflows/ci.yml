name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Adapter packages import from `@jenz-ai/sdk` (the `packages/core` workspace),
      # which resolves to `packages/core/dist` at type-check and test time. Build
      # first so those artifacts exist — pnpm respects workspace dependency order,
      # so `core` is built before the adapters.
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
